<!DOCTYPE html>
<html>
<head>
    <title>Border Entry System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .section {
            flex: 1;
            min-width: 0;
        }

        iframe {
            width: 100%;
            height: 650px;
            border: 1px solid gray;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }

            .section {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Border Entry Payment and Personnel Tracking System</h1>

    <hr>

    <div class="container">

        <div class="section">
            <h2>Personnel Management</h2>
            <iframe src="pages/personnel.html"></iframe>
        </div>

        <div class="section">
            <h2>Shift Management</h2>
            <iframe src="pages/shifts.html"></iframe>
        </div>

        <div class="section">
            <h2>Checkpoint Assignment Management</h2>
            <iframe src="pages/assignments.html"></iframe>
        </div>

    </div>

</body>
</html>
