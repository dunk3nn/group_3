<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Transactions</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>Payment Transactions</h1>

        <!-- Process Payment Form -->
        <section class="form-section">
            <h2>Process New Payment</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label for="entry-record">Entry Record ID:</label>
                    <input type="number" id="entry-record" name="entry_record_id" required>
                </div>

                <div class="form-group">
                    <label for="fee-rule">Fee Rule ID:</label>
                    <input type="number" id="fee-rule" name="fee_rule_id" required>
                </div>

                <div class="form-group">
                    <label for="penalty-id">Penalty ID (Optional):</label>
                    <input type="number" id="penalty-id" name="penalty_id" placeholder="Leave blank if none">
                </div>

                <div class="form-group">
                    <label for="amount-paid">Amount Paid ($):</label>
                    <input type="number" id="amount-paid" name="amount_paid" step="0.01" min="0.01" required>
                </div>

                <div class="form-group">
                    <label for="payment-method">Payment Method:</label>
                    <select id="payment-method" name="payment_method" required>
                        <option value="Cash">Cash</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Mobile Payment">Mobile Payment</option>
                    </select>
                </div>

                <button type="submit">Submit Payment</button>
            </form>
        </section>

        <!-- Payments Log Table -->
        <section class="table-section">
            <h2>Recent Payments</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Record ID</th>
                        <th>Fee Rule</th>
                        <th>Penalty ID</th>
                        <th>Amount Paid</th>
                        <th>Payment Method</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="payments-list">
                    <!-- Loaded dynamically from db -->
                </tbody>
            </table>
        </section>
    </div>
    <script src="../js/payments.js"></script>
</body>
</html>
